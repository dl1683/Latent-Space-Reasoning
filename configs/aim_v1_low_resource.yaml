# AIM-v1 low-resource profile
# Goal: maximize accessibility and reproducibility on modest hardware.

encoder:
  model: "Qwen/Qwen3-0.6B"
  device: "cpu"
  quantization: "none"
  layer: -4
  pooling: "mean"
  latent_dim: 1024
  max_length: 1024

judges:
  scorers:
    - type: "semantic"
      model: "sentence-transformers/all-MiniLM-L6-v2"
      layer: -1
      quantization: "none"
  modifiers: []
  aggregation: "mean"
  calibrate: true

evolution:
  chains: 3
  generations: 6
  temperature: 0.45
  temperature_decay: 0.95
  min_viable_score: 0.0
  score_cache: false
  score_cache_precision: 4
  selection:
    strategy: "elitist"
    survivors: 3
    elite: 1
    adaptive_survivors: true
    min_survivors: 1
    survivor_decay: 0.5
    survivor_decay_patience: 1
  mutation:
    strategy: "adaptive"
    trust: 0.5
    noise_scale: 0.35
  crossover:
    strategy: "weighted"
    threshold: 0.35
  merge:
    threshold: 0.9
  convergence:
    threshold: 0.9
    patience: 3

budget:
  max_evaluations: 90
  max_time: 120

synthesis:
  decode_strategy: "best"
  max_survivors: 3
  max_tokens: 768
  temperature: 0.6

output:
  verbosity: "minimal"
  format: "text"
  save_history: true
  history_path: "experiments/logs/aim_v1_low_resource"
